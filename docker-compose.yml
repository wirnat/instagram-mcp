services:
  instagram-mcp:
    build: .
    image: instagram-mcp:latest
    container_name: instagram-mcp
    restart: unless-stopped
    # Chromium needs more shared memory than the Docker default (64 MB).
    shm_size: 1gb
    environment:
      # Required. Agents connect with the header "Authorization: Bearer <token>".
      INSTAGRAM_MCP_TOKEN: ${INSTAGRAM_MCP_TOKEN:?set INSTAGRAM_MCP_TOKEN in .env}
      TZ: ${TZ:-UTC}
    ports:
      # Bound to the server's localhost only. Put a TLS reverse proxy in front for remote access.
      - "127.0.0.1:48300:48300"
    volumes:
      - instagram-mcp-data:/data

volumes:
  instagram-mcp-data:
